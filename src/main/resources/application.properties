spring.application.name=cc-backend-ai

server.port = 2991

spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${MYSQL_DB_URL}
spring.datasource.username=${MYSQL_DB_USER}
spring.datasource.password=${MYSQL_DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.mail.store.protocol=imaps
spring.mail.imap.host=imap.gmail.com
spring.mail.imap.port=993
spring.mail.imap.connectiontimeout=5000
spring.mail.imap.timeout=5000	
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}

spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.hibernate.SQL=trace

codeNameMap=${CODE_NAME_VALUES}

authHeaderBP=${AUTH_HEADER_BP}

ccBackendURL=${CC_BACKEND_URL}

# SMTP - Sending emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Connection and I/O timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

digest.timezone=${DIGEST_TIMEZONE}
digest.cron=${DIGEST_CRON}
digest.recipient=${DIGEST_TO}
digest.sender=${DIGEST_FROM:${MAIL_USER}}

digest.rss-feeds=${RSS_WORLD},${RSS_INDIA},${RSS_DELHI_NCR},${RSS_CHANDIGARH}

# Include timestamps and log levels
#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
#logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n